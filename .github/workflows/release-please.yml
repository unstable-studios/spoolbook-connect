name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: unstable-studios/.github/.github/workflows/release-please.yml@main
    secrets:
      GH_PAT_RELEASEPLEASE: ${{ secrets.GH_PAT_RELEASEPLEASE }}

  # A release carries the module Connect installs: the .tar.gz for
  # `prusa-connect module add -from`, and its checksums.
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - id: build
        run: echo "archive=$(sh scripts/release.sh release | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" release/checksums.txt --clobber
